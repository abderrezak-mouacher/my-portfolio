  <!-- Global styles -->
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #05070a;
      color: #f1f5f4;
      position: relative;
    }

    h1, h2, h3, h4,
    nav .brand-mark {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }

    /* Faint PCB substrate texture: solder-mask grid + copper vias */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        linear-gradient(rgba(185, 119, 60, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(185, 119, 60, 0.05) 1px, transparent 1px),
        radial-gradient(rgba(79, 219, 130, 0.08) 1px, transparent 1.4px);
      background-size: 48px 48px, 48px 48px, 96px 96px;
      background-position: 0 0, 0 0, 24px 24px;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    @keyframes fadeInZoom {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    img[class*="animate-in"] {
      animation: fadeInZoom 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Trace-draw animation used by hero circuit diagram */
    @keyframes traceDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .trace-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: traceDraw 2.4s ease-out forwards;
    }

    .via-node {
      opacity: 0;
      animation: fadeInZoom 0.5s ease-out forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .trace-path,
      .via-node,
      img[class*="animate-in"] {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
      }
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0f0d;
    }

    ::-webkit-scrollbar-thumb {
      background: #1c5e5b;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #227672;
    }
  </style>
